[package]
name = "apex-venue"
version = "1.0.0"
edition = "2021"
license = "UNLICENSED"

[dependencies]
tokio = { version = "1.36", features = ["full", "signal"] }
axum = { version = "0.7", features = ["macros"] }
sha2 = "0.10"
bincode = "1.3"
crc32fast = "1.4"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "macros"] }
rdkafka = { version = "0.36", features = ["cmake-build"] }
uuid = { version = "1.7", features = ["v5", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
crossbeam = "0.8"
chrono = "0.4"

[dev-dependencies]
rand = "0.8"
proptest = "1.4"
assert_fs = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
