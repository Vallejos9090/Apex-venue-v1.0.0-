apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matching-engine
    namespace: trading
    spec:
      serviceName: matching-engine
        replicas: 1
          selector:
              matchLabels:
                    app: matching-engine
                      template:
                          metadata:
                                labels:
                                        app: matching-engine
                                            spec:
                                                  securityContext:
                                                          runAsNonRoot: true
                                                                  fsGroup: 1000
                                                                        containers:
                                                                              - name: engine
                                                                                      image: apex-venue/engine:latest
                                                                                              ports:
                                                                                                      - containerPort: 9090
                                                                                                                name: admin
                                                                                                                        resources:
                                                                                                                                  limits:
                                                                                                                                              cpu: "2"
                                                                                                                                                          memory: "4Gi"
                                                                                                                                                                  livenessProbe:
                                                                                                                                                                            httpGet:
                                                                                                                                                                                        path: /health
                                                                                                                                                                                                    port: 9090
                                                                                                                                                                                                              initialDelaySeconds: 10
                                                                                                                                                                                                                        periodSeconds: 5
                                                                                                                                                                                                                                readinessProbe:
                                                                                                                                                                                                                                          httpGet:
                                                                                                                                                                                                                                                      path: /ready
                                                                                                                                                                                                                                                                  port: 9090
                                                                                                                                                                                                                                                                            initialDelaySeconds: 5
                                                                                                                                                                                                                                                                                      periodSeconds: 3
                                                                                                                                                                                                                                                                                              env:
                                                                                                                                                                                                                                                                                                      - name: KAFKA_BROKERS
                                                                                                                                                                                                                                                                                                                value: "redpanda:9092"
                                                                                                                                                                                                                                                                                                                        - name: WAL_PATH
                                                                                                                                                                                                                                                                                                                                  value: "/data/engine.wal"
                                                                                                                                                                                                                                                                                                                                          - name: DB_URL
                                                                                                                                                                                                                                                                                                                                                    valueFrom:
                                                                                                                                                                                                                                                                                                                                                                secretKeyRef:
                                                                                                                                                                                                                                                                                                                                                                              name: db-creds
                                                                                                                                                                                                                                                                                                                                                                                            key: url
                                                                                                                                                                                                                                                                                                                                                                                                    volumeMounts:
                                                                                                                                                                                                                                                                                                                                                                                                              - name: wal-pvc
                                                                                                                                                                                                                                                                                                                                                                                                                        mountPath: /data
                                                                                                                                                                                                                                                                                                                                                                                                                          volumeClaimTemplates:
                                                                                                                                                                                                                                                                                                                                                                                                                            - metadata:
                                                                                                                                                                                                                                                                                                                                                                                                                                  name: wal-pvc
                                                                                                                                                                                                                                                                                                                                                                                                                                      spec:
                                                                                                                                                                                                                                                                                                                                                                                                                                            accessModes: [ReadWriteOnce]
                                                                                                                                                                                                                                                                                                                                                                                                                                                  resources:
                                                                                                                                                                                                                                                                                                                                                                                                                                                          requests:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    storage: 50Gi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          storageClassName: gp3-encrypted
